# Thin native CI: lint, typecheck, test, build across the Bun workspace,
# the .NET package in its own job,
# plus trunk hold-the-line on pull requests.
#
# Deliberately self-contained — no reusable-workflow dependency. Once
# lekman/devops-toolkit is generalised (org-neutral, hosted-runner
# compatible, public), this file collapses to a single `uses:` call.

name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: Typecheck all packages
        run: bun run typecheck

      - name: Test all packages
        run: |
          for pkg in packages/*/package.json; do
            dir=$(dirname "$pkg")
            if [ -d "$dir/tests" ] || ls "$dir"/*.test.ts >/dev/null 2>&1; then
              echo "--- bun test: $dir"
              (cd "$dir" && bun test)
            fi
          done

      - name: Build all packages
        run: bun run build

      # The node:test conformance files are TypeScript that Node loads
      # directly, which needs Node 22.18 or later. Node 22 is what
      # mise.toml pins for development.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Every package with a `conformance` script runs it: for qualify, the
      # shared scenarios through vitest, node:test and bun, diffed against
      # spec/qualify/conformance/expected/. Any difference fails the job.
      - name: Conformance
        run: bun run conformance

  # packages/qualify-dotnet: build with warnings as errors, unit tests with a
  # line coverage floor of 80%, formatting, the conformance scenarios through
  # the real xUnit runner, and a pack of both packages. The conformance
  # harness calls the TypeScript CLI for `trace`, so Bun builds it first.
  dotnet:
    name: .NET (qualify-dotnet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/qualify-dotnet
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build the TypeScript CLI for trace
        working-directory: .
        run: |
          bun install --frozen-lockfile
          bun run build

      # The SDK from global.json builds; the .NET 10 runtime runs the
      # net10.0 build of the tests.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: packages/qualify-dotnet/global.json
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Lekman.Qualify.slnx

      - name: Build (warnings as errors)
        run: dotnet build Lekman.Qualify.slnx --no-restore --configuration Release -warnaserror

      - name: Format
        run: dotnet format Lekman.Qualify.slnx --no-restore --verify-no-changes

      - name: Unit tests with coverage (line 80%)
        run: >-
          dotnet test --project tests/Lekman.Qualify.Tests --no-build --configuration Release
          --coverlet --coverlet-output-format cobertura --coverlet-include "[Lekman.Qualify]*"
          --coverlet-threshold 80 --coverlet-threshold-type line

      # Every scenario of spec/qualify/conformance/README.md through the real
      # xUnit v3 runner, diffed against the shared expected files, plus the
      # dotnet test filters by level, tag and ID.
      - name: Conformance
        run: dotnet test --project conformance/Lekman.Qualify.Conformance.Harness --no-build --configuration Release

      - name: Pack
        run: |
          dotnet pack src/Lekman.Qualify --no-build --configuration Release --output artifacts
          dotnet pack src/Lekman.Qualify.Tool --no-build --configuration Release --output artifacts

  trunk:
    name: Trunk hold-the-line
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      checks: write # composite posts inline annotations via the Checks API
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # composite prerequisite: trunk diffs against the PR base

      # Direct action for now. The devops-toolkit trunk composite cannot be
      # referenced from a public repo (private-action sharing is
      # private-caller-only — verified empirically 2026-08-09). Swap to the
      # composite via GitHub App token + checkout once TOOLKIT_APP_ID /
      # TOOLKIT_APP_PRIVATE_KEY secrets exist.
      - uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
        with:
          check-mode: pull_request
