# Thin native CI: lint, typecheck, test, build across the Bun workspace,
# plus trunk hold-the-line on pull requests.
#
# Deliberately self-contained — no reusable-workflow dependency. Once
# lekman/devops-toolkit is generalised (org-neutral, hosted-runner
# compatible, public), this file collapses to a single `uses:` call.

name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: Typecheck all packages
        run: bun run typecheck

      - name: Test all packages
        run: |
          for pkg in packages/*/package.json; do
            dir=$(dirname "$pkg")
            if [ -d "$dir/tests" ] || ls "$dir"/*.test.ts >/dev/null 2>&1; then
              echo "--- bun test: $dir"
              (cd "$dir" && bun test)
            fi
          done

      - name: Build all packages
        run: bun run build

      # The node:test conformance files are TypeScript that Node loads
      # directly, which needs Node 22.18 or later. Node 22 is what
      # mise.toml pins for development.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Every package with a `conformance` script runs it: for qualify, the
      # shared scenarios through vitest, node:test and bun, diffed against
      # spec/qualify/conformance/expected/. Any difference fails the job.
      - name: Conformance
        run: bun run conformance

  # The Python package of qualify. The devops-actions Python composites take
  # a working-directory, so they run on packages/qualify-python as they would
  # on a Python repository's root: detect-language reads its pyproject.toml
  # and uv.lock, python-quality runs ruff, mypy and pytest with coverage (the
  # 80 % floor is in pyproject.toml). Plain steps cover what the composites do
  # not: the ruff format check, and the conformance harness, which needs the
  # TypeScript CLI built for its trace scenarios.
  python:
    name: Python qualify (lint, typecheck, test, conformance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PROJECT: packages/qualify-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect the Python project
        id: detect
        uses: lekman/devops-actions/.github/actions/detect-language@bf452e60eacfab7884b3a20e74d0c64eff204415 # main
        with:
          working-directory: ${{ env.PROJECT }}

      - name: Setup Python toolchain
        uses: lekman/devops-actions/.github/actions/setup-runtime@bf452e60eacfab7884b3a20e74d0c64eff204415 # main
        with:
          working-directory: ${{ env.PROJECT }}
          python-version: ${{ steps.detect.outputs.python-version }}

      - name: Install Python dependencies
        uses: lekman/devops-actions/.github/actions/python-deps@bf452e60eacfab7884b3a20e74d0c64eff204415 # main
        with:
          working-directory: ${{ env.PROJECT }}
          package-manager: ${{ steps.detect.outputs.python-pm }}
          install-pip-audit: "false"

      - name: Python lint, typecheck, test
        uses: lekman/devops-actions/.github/actions/python-quality@bf452e60eacfab7884b3a20e74d0c64eff204415 # main
        with:
          working-directory: ${{ env.PROJECT }}
          package-manager: ${{ steps.detect.outputs.python-pm }}
          lint-tools: ${{ steps.detect.outputs.python-lint-tools }}
          run-typecheck: ${{ steps.detect.outputs.python-has-typecheck }}
          run-test: ${{ steps.detect.outputs.python-has-test }}
          findings-dir: ${{ runner.temp }}/findings-python

      - name: Ruff format check
        if: ${{ !cancelled() }}
        working-directory: ${{ env.PROJECT }}
        run: uv run ruff format --check .

      # The trace scenarios (12, 19 and 20) run the TypeScript CLI on the
      # run file Python writes, so the workspace is built first.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build the TypeScript CLI
        run: bun install --frozen-lockfile && bun run build

      # Every scenario through the real pytest plugin, diffed byte for byte
      # against spec/qualify/conformance/expected/. Any difference fails the job.
      - name: Conformance
        working-directory: ${{ env.PROJECT }}
        run: uv run python conformance/run.py

  trunk:
    name: Trunk hold-the-line
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      checks: write # composite posts inline annotations via the Checks API
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # composite prerequisite: trunk diffs against the PR base

      # Direct action for now. The devops-toolkit trunk composite cannot be
      # referenced from a public repo (private-action sharing is
      # private-caller-only — verified empirically 2026-08-09). Swap to the
      # composite via GitHub App token + checkout once TOOLKIT_APP_ID /
      # TOOLKIT_APP_PRIVATE_KEY secrets exist.
      - uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
        with:
          check-mode: pull_request
