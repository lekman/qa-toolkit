# Thin native CI: lint, typecheck, test, build across the Bun workspace,
# plus trunk hold-the-line on pull requests.
#
# Deliberately self-contained — no reusable-workflow dependency. Once
# lekman/devops-toolkit is generalised (org-neutral, hosted-runner
# compatible, public), this file collapses to a single `uses:` call.

name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: Typecheck all packages
        run: bun run typecheck

      - name: Test all packages
        run: |
          for pkg in packages/*/package.json; do
            dir=$(dirname "$pkg")
            if [ -d "$dir/tests" ] || ls "$dir"/*.test.ts >/dev/null 2>&1; then
              echo "--- bun test: $dir"
              (cd "$dir" && bun test)
            fi
          done

      - name: Build all packages
        run: bun run build

      # The node:test conformance files are TypeScript that Node loads
      # directly, which needs Node 22.18 or later. Node 22 is what
      # mise.toml pins for development.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Every package with a `conformance` script runs it: for qualify, the
      # shared scenarios through vitest, node:test and bun, diffed against
      # spec/qualify/conformance/expected/. Any difference fails the job.
      - name: Conformance
        run: bun run conformance

  # The Java package, packages/qualify-jvm: Spotless (google-java-format and
  # ktlint), Error Prone with NullAway, detekt, the unit and Kotlin tests with
  # JaCoCo's coverage gate, then every conformance scenario. The JVM build
  # compiles on JDK 21, which Error Prone and google-java-format need, for
  # Java 17, and runs the tests and the CLI on Java 17. The trace scenarios
  # call the TypeScript CLI, so it is built first.
  jvm:
    name: JVM package (qualify-jvm)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/qualify-jvm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # The last one listed becomes JAVA_HOME.
          java-version: |
            21
            17
          cache: gradle

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build the TypeScript CLI for the trace scenarios
        working-directory: .
        run: |
          bun install --frozen-lockfile
          bun run --filter '@lekman/qualify' build

      # Gradle finds the two JDKs setup-java installed through these variables,
      # instead of downloading its own.
      - name: Build, check and test
        run: ./gradlew build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64

      - name: Conformance
        run: ./gradlew conformance -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64

  trunk:
    name: Trunk hold-the-line
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      checks: write # composite posts inline annotations via the Checks API
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # composite prerequisite: trunk diffs against the PR base

      # Direct action for now. The devops-toolkit trunk composite cannot be
      # referenced from a public repo (private-action sharing is
      # private-caller-only — verified empirically 2026-08-09). Swap to the
      # composite via GitHub App token + checkout once TOOLKIT_APP_ID /
      # TOOLKIT_APP_PRIVATE_KEY secrets exist.
      - uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
        with:
          check-mode: pull_request
