name: Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job states what it needs. The default for anything else is read-only.
permissions:
  contents: read # check out the repository

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write # create the release tags and the GitHub releases
      pull-requests: write # open and update the release pull request
    outputs:
      # Which packages released. Each publish job below runs only when its
      # package is in this list.
      paths_released: ${{ steps.release.outputs.paths_released }}
      npm_paths: ${{ steps.npm.outputs.paths }}
      python_released: ${{ steps.release.outputs['packages/qualify-python--release_created'] }}
      jvm_released: ${{ steps.release.outputs['packages/qualify-jvm--release_created'] }}
      dotnet_released: ${{ steps.release.outputs['packages/qualify-dotnet--release_created'] }}
      vscode_released: ${{ steps.release.outputs['packages/qualify-vscode--release_created'] }}
      vscode_tag: ${{ steps.release.outputs['packages/qualify-vscode--tag_name'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Prefer a GitHub App token. It gives the bot its own identity — which is
      # why CODEOWNERS can assign the changelog and manifest to it — and it
      # avoids the repository-wide "Actions may create and approve pull
      # requests" permission, which also lets automation approve its own work.
      #
      # continue-on-error so a repo without the secrets still releases via
      # GITHUB_TOKEN. That path needs the repository setting enabled; the App
      # path does not, and is the one to end up on.
      - name: Generate GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Report which identity is releasing
        run: |
          if [ -n "${{ steps.app-token.outputs.token }}" ]; then
            echo "releasing as the GitHub App"
          else
            echo "::warning::vars.APP_ID / secrets.APP_PRIVATE_KEY not set — falling back to GITHUB_TOKEN, which needs 'Allow GitHub Actions to create and approve pull requests' enabled on this repository. Add the App secrets and the setting can be turned back off."
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: .github/release-config.json
          manifest-file: .github/release-manifest.json

      # The npm job publishes the released packages that have a package.json
      # and are not marked private. The VS Code extension is private: it goes
      # to its GitHub release as a .vsix instead. Python, Java and .NET each
      # have their own job further down.
      - name: List the released npm packages
        id: npm
        env:
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released || '[]' }}
        run: |
          paths=$(jq -r '.[]' <<<"$PATHS_RELEASED" | while read -r path; do
            if [ -f "$path/package.json" ] && [ "$(jq -r '.private // false' "$path/package.json")" != "true" ]; then
              echo "$path"
            fi
          done | jq -R . | jq -cs .)
          echo "npm packages released: $paths"
          echo "paths=$paths" >> "$GITHUB_OUTPUT"

  # Publish every npm package release-please just released, with npm trusted
  # publishing (OIDC). No npm token exists anywhere: the job's id-token
  # permission lets npm verify that this workflow, in this repository, is the
  # publisher configured on npmjs.com, and npm attaches provenance on its own.
  #
  # The trusted publishers on npmjs.com are bound to this file's name, cd.yml.
  # Renaming the file breaks publishing until the connections are recreated.
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release
    if: needs.release.outputs.npm_paths != '' && needs.release.outputs.npm_paths != '[]'
    permissions:
      contents: read # check out the repository
      id-token: write # mint the OIDC token npm exchanges for a publish credential
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.release.outputs.npm_paths) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 because trusted publishing needs npm 11.5.1 or later and Node
      # 22 still bundles npm 10. registry-url writes the .npmrc npm reads.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Check npm supports trusted publishing
        run: |
          version=$(npm --version)
          echo "npm $version"
          if [ "$(printf '%s\n11.5.1\n' "$version" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $version is older than 11.5.1, which trusted publishing needs"
            exit 1
          fi

      # npm includes a LICENSE next to package.json. The repo keeps one copy at
      # the root and each package gitignores its own, as scripts/release.ts does.
      - name: Copy the licence into the package
        run: cp LICENSE "${{ matrix.path }}/LICENSE"

      # A version published by hand before trusted publishing was set up (the
      # first @lekman/qualify release) is already on npm. npm refuses to
      # publish a version twice, so the job skips it instead of failing.
      - name: Check whether this version is on npm
        id: published
        working-directory: ${{ matrix.path }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm; skipping publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly runs `bun run check` (typecheck, test, build), so the
      # tarball is built and verified by npm itself right before upload.
      - name: Publish
        if: steps.published.outputs.exists != 'true'
        working-directory: ${{ matrix.path }}
        run: npm publish --access public

  # lekman-qualify to PyPI. The build runs in its own job without the OIDC
  # permission, so the code that builds the package never holds the
  # credential that uploads it.
  build-pypi:
    name: Build for PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release
    if: needs.release.outputs.python_released == 'true'
    permissions:
      contents: read # check out the repository
    defaults:
      run:
        working-directory: packages/qualify-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: a release builds from a clean state.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: 0.13.7
          enable-cache: false

      - name: Build the sdist and the wheel
        run: uv build --out-dir dist

      # The same check PyPI applies to the metadata and the README.
      - name: Check the package metadata
        run: uvx twine==7.0.0 check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: packages/qualify-python/dist/
          if-no-files-found: error
          retention-days: 7

  # PyPI trusted publishing: PyPI checks that the OIDC token comes from
  # cd.yml in lekman/qa-toolkit, environment pypi, and issues a short-lived
  # upload token. No API token is stored. The action also uploads digital
  # attestations for both files.
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-pypi
    environment:
      name: pypi
      url: https://pypi.org/project/lekman-qualify/
    permissions:
      id-token: write # mint the OIDC token PyPI exchanges for an upload token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/

      # skip-existing lets a re-run finish an upload that stopped half-way.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  # com.lekman:qualify to Maven Central, through the Central Portal, with the
  # com.vanniktech.maven.publish plugin configured in build.gradle.kts. The
  # Central Portal has no OIDC publishing, so this job uses a portal user
  # token and a GPG key stored on the maven-central environment.
  publish-maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: release
    if: needs.release.outputs.jvm_released == 'true'
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/com.lekman/qualify
    permissions:
      contents: read # check out the repository
    defaults:
      run:
        working-directory: packages/qualify-jvm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No Gradle cache: a release builds from a clean state. javac runs on
      # JDK 21 for Java 17, as in the ci.yml jvm job.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            21
            17

      # The build signs only when a key is set, so a missing secret would
      # otherwise surface as a rejected upload on the portal.
      - name: Check the credentials and the signing key are set
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          missing=0
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is not set on the maven-central environment"
              missing=1
            fi
          done
          exit "$missing"

      # Uploads the jar, sources, Javadoc, POM and module file with their
      # signatures, then waits while the portal validates the deployment and
      # publishes it (automaticRelease in build.gradle.kts).
      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64

  # Lekman.Qualify and Lekman.Qualify.Tool to nuget.org, with nuget.org trusted
  # publishing: NuGet/login exchanges the job's OIDC token for an API key
  # that is valid for one hour. The policy on nuget.org names this repository,
  # cd.yml and the nuget environment. No API key is stored.
  publish-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: release
    if: needs.release.outputs.dotnet_released == 'true'
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Lekman.Qualify
    permissions:
      contents: read # check out the repository
      id-token: write # mint the OIDC token nuget.org exchanges for an API key
    defaults:
      run:
        working-directory: packages/qualify-dotnet
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SDK from global.json, plus the .NET 10 runtime, as in the ci.yml
      # dotnet job.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: packages/qualify-dotnet/global.json
          dotnet-version: 10.0.x

      # Each pack writes a .nupkg and a .snupkg (symbols).
      - name: Pack
        run: |
          dotnet pack src/Lekman.Qualify --configuration Release --output artifacts
          dotnet pack src/Lekman.Qualify.Tool --configuration Release --output artifacts

      # Asked for right before the push, because the key expires after an hour.
      - name: Get a short-lived NuGet API key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # dotnet nuget push uploads each .snupkg with its .nupkg. skip-duplicate
      # lets a re-run finish a push that stopped half-way.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # The VS Code extension, packages/qualify-vscode, as a .vsix on its GitHub
  # release. It is not published to the VS Code Marketplace or Open VSX, so
  # no store token exists. The build runs without write access, so the code
  # that builds the .vsix never holds the credential that changes the
  # release.
  build-vscode:
    name: Build the VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release
    if: needs.release.outputs.vscode_released == 'true'
    permissions:
      contents: read # check out the repository
    defaults:
      run:
        working-directory: packages/qualify-vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node and Bun come from mise.toml, as in the ci.yml quality job.
      - name: Setup Node toolchain
        uses: lekman/devops-actions/.github/actions/setup-runtime@bf452e60eacfab7884b3a20e74d0c64eff204415 # main
        with:
          install-args: node bun

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # vsce names the file <name>-<version>.vsix from package.json, which
      # release-please has just bumped.
      - name: Package the extension
        run: bun run package

      # The tag release-please created and the version in package.json must
      # agree, or the release would carry a .vsix of another version.
      - name: Check the .vsix matches the release
        id: vsix
        env:
          TAG: ${{ needs.release.outputs.vscode_tag }}
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          file="$name-$version.vsix"
          if [ "$TAG" != "$name@v$version" ]; then
            echo "::error::The release tag $TAG does not match $name $version in package.json"
            exit 1
          fi
          if [ ! -f "$file" ]; then
            echo "::error::$file was not written"
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualify-vscode-vsix
          path: packages/qualify-vscode/${{ steps.vsix.outputs.file }}
          if-no-files-found: error

  # Attaches the .vsix to the qualify-vscode GitHub release. --clobber lets a
  # re-run replace the file it uploaded before.
  attach-vscode:
    name: Attach the VS Code extension to the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [release, build-vscode]
    permissions:
      contents: write # upload a file to the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualify-vscode-vsix
          path: vsix/

      - name: Upload the .vsix to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.vscode_tag }}
        run: gh release upload "$TAG" vsix/*.vsix --repo "$GITHUB_REPOSITORY" --clobber
