name: Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # Which packages released, for a later publish job to consume. Publishing
      # still runs from a maintainer machine via scripts/release.ts; this is
      # the seam for moving it into CI without changing the release flow.
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Prefer a GitHub App token. It gives the bot its own identity — which is
      # why CODEOWNERS can assign the changelog and manifest to it — and it
      # avoids the repository-wide "Actions may create and approve pull
      # requests" permission, which also lets automation approve its own work.
      #
      # continue-on-error so a repo without the secrets still releases via
      # GITHUB_TOKEN. That path needs the repository setting enabled; the App
      # path does not, and is the one to end up on.
      - name: Generate GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Report which identity is releasing
        run: |
          if [ -n "${{ steps.app-token.outputs.token }}" ]; then
            echo "releasing as the GitHub App"
          else
            echo "::warning::vars.APP_ID / secrets.APP_PRIVATE_KEY not set — falling back to GITHUB_TOKEN, which needs 'Allow GitHub Actions to create and approve pull requests' enabled on this repository. Add the App secrets and the setting can be turned back off."
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: .github/release-config.json
          manifest-file: .github/release-manifest.json

  # Publish every package release-please just released, with npm trusted
  # publishing (OIDC). No npm token exists anywhere: the job's id-token
  # permission lets npm verify that this workflow, in this repository, is the
  # publisher configured on npmjs.com, and npm attaches provenance on its own.
  #
  # The trusted publisher on npmjs.com is bound to this file's name, cd.yml.
  # Renaming the file breaks publishing until the connection is recreated.
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release
    if: needs.release.outputs.paths_released != '' && needs.release.outputs.paths_released != '[]'
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm exchanges for a publish credential
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.release.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 because trusted publishing needs npm 11.5.1 or later and Node
      # 22 still bundles npm 10. registry-url writes the .npmrc npm reads.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Check npm supports trusted publishing
        run: |
          version=$(npm --version)
          echo "npm $version"
          if [ "$(printf '%s\n11.5.1\n' "$version" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $version is older than 11.5.1, which trusted publishing needs"
            exit 1
          fi

      # npm includes a LICENSE next to package.json. The repo keeps one copy at
      # the root and each package gitignores its own, as scripts/release.ts does.
      - name: Copy the licence into the package
        run: cp LICENSE "${{ matrix.path }}/LICENSE"

      # prepublishOnly runs `bun run check` (typecheck, test, build), so the
      # tarball is built and verified by npm itself right before upload.
      - name: Publish
        working-directory: ${{ matrix.path }}
        run: npm publish --access public
