[test]
# Unit tests only. The conformance scenarios under conformance/ run through
# their own runners from conformance/run.ts, never through this `bun test`.
root = "tests"
coverage = true
coverageThreshold = { line = 0.8, function = 0.6, statement = 0.8 }
coveragePathIgnorePatterns = [
  "**/*.system.ts",  # System wrappers, no business logic
  "**/index.ts",     # Barrel re-exports, no business logic
  "src/cli/cli.ts",  # CLI entrypoint, wiring only
  "src/adapters/**", # Runner glue, exercised by the conformance runs
  "conformance/**",
  "scripts/**",
  "tests/**",
  "**/*.test.ts",
]
