[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lekman-qualify"
version = "0.1.0"
description = "Qualification tests (IQ, OQ, PQ, intended use) for pytest that write redacted JSON evidence and a PDF report."
readme = "README.md"
license = "MIT"
# The bundled fonts are under the SIL Open Font License; their licence files ship too.
license-files = ["src/qualify/themes/*/fonts/OFL.txt"]
authors = [{ name = "Tobias Lekman" }]
requires-python = ">=3.10"
keywords = ["qualification", "validation", "evidence", "traceability", "pytest"]
# No licence classifier: the license expression above replaces it (PEP 639).
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "fpdf2>=2.8.3",
  "jsonschema>=4.18",
  "pytest>=8.3",
  "pyyaml>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/lekman/qa-toolkit/tree/main/packages/qualify-python"
Repository = "https://github.com/lekman/qa-toolkit"
Issues = "https://github.com/lekman/qa-toolkit/issues"
Changelog = "https://github.com/lekman/qa-toolkit/blob/main/packages/qualify-python/CHANGELOG.md"
Specification = "https://github.com/lekman/qa-toolkit/blob/main/spec/qualify/README.md"

[project.entry-points.pytest11]
qualify = "qualify.plugin"

[project.scripts]
qualify = "qualify.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pypdf>=6.1",
  "pypdfium2>=4.30",
  "pytest-cov>=7.0",
  "pytest-xdist>=3.8",
  "ruff==0.17.6",
  "types-jsonschema>=4.25",
  "types-pyyaml>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qualify"]

[tool.hatch.build.targets.sdist]
include = ["src/qualify", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The plugin is not loaded into the outer session: entry-point plugins load
# before pytest-cov starts measuring, so their module lines would count as
# missed. The pytester runs inside the tests load it themselves.
addopts = ["-p", "pytester", "-p", "no:qualify", "--strict-markers"]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
source = ["qualify"]
branch = false

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "conformance", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4", "PIE", "RET", "TID"]
# The exception names are the type names the evidence records, as the
# specification gives them (CheckFailed, AttachmentTooLarge).
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# The narrative scenario holds typographic quotes on purpose.
"conformance/*.py" = ["RUF001"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "conformance", "scripts"]
mypy_path = ["src", "tests"]
warn_unreachable = true
